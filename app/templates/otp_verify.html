<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTP Verification</title>
</head>

<body style="
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      font-family: Arial, Helvetica, sans-serif;
      color: #333333;
    ">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" style="padding: 30px 15px">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
          style="width: 100%; max-width: 600px; background: #ffffff; border: 1px solid #e0e0e0">
          <!-- Header -->
          <tr>
            <td style="padding: 25px 30px; border-bottom: 2px solid #2563eb">
              <h1 style="margin: 0; font-size: 20px; color: #2563eb">BeingIdeal</h1>
            </td>
          </tr>

          <!-- Content -->
          <tr>
            <td style="padding: 30px">
              <p style="margin: 0 0 15px; font-size: 16px">
                Hello, <strong>{{ email }}</strong>
              </p>

              <p style="margin: 0 0 20px; font-size: 15px; line-height: 24px">
                Use the OTP below to verify your account:
              </p>

              <div style="
                    padding: 15px;
                    background: #f5f7fa;
                    border: 1px solid #dddddd;
                    font-size: 24px;
                    font-weight: bold;
                    letter-spacing: 4px;
                    color: #2563eb;
                    text-align: center;
                  ">
                {{ OTP }}
              </div>

              <p style="margin: 20px 0 0; font-size: 14px; line-height: 22px; color: #666666">
                This OTP is valid for 10 minutes. If you did not request
                this, please ignore this email.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding: 20px 30px; border-top: 1px solid #eeeeee">
              <p style="margin: 0; font-size: 14px">
                Thank you,<br />
                <strong>The BeingIdeal Team</strong>
              </p>
              <p style="margin: 12px 0 0; font-size: 12px; color: #999999">
                © {{ current_year }} BeingIdeal. All rights reserved.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>
