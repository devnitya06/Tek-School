services:
  web:
    build: .
    container_name: fastapi-app
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - ./logs:/app/logs   # ✅ logs survive container restarts
    logging:
      driver: "json-file"
      options:
        max-size: "10m"    # each docker log file max 10MB
        max-file: "5"      # keep last 5 files = 50MB max
    deploy:
      resources:
        limits:
          memory: 512M
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8001"

  celery_worker:
    build: .
    container_name: celery-worker
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    depends_on:
      - redis
      - db
    volumes:
      - ./logs:/app/logs   # ✅ share same logs folder as web
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 256M

  celery_beat:
    build: .
    container_name: celery-beat
    restart: always
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
      - db
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6380:6379"
    deploy:
      resources:
        limits:
          memory: 128M  # small task queue for 2 daily tasks — 128M is plenty

  db:
    image: postgres:15
    container_name: postgres-db
    restart: always
    shm_size: 256m  # 25% of shared_buffers=256MB — correct ratio
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: tek_school
      POSTGRES_INITDB_ARGS: >-
        -c max_connections=50
        -c shared_buffers=256MB
        -c effective_cache_size=1536MB
        -c maintenance_work_mem=64MB
        -c work_mem=4MB
        -c wal_buffers=16MB
        -c checkpoint_completion_target=0.9
        -c log_min_duration_statement=1000
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres", "-d", "tek_school" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G  # 8GB server — 2GB for PostgreSQL leaves 6GB for everything else

volumes:
  postgres_data:
