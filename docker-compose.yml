services:
  web:
    build: .
    container_name: fastapi-app
    restart: always
    ports:
      - "8001:8001"
    environment:
      - TZ=Asia/Kolkata
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - ./logs:/app/logs # ✅ logs survive container restarts
    logging:
      driver: "json-file"
      options:
        max-size: "10m" # each docker log file max 10MB
        max-file: "5" # keep last 5 files = 50MB max
    deploy:
      resources:
        limits:
          cpus: '1.5'   # ← prevent web from starving postgres/celery during spikes
          memory: 512M
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8001"

  celery_worker:
    build: .
    container_name: celery-worker
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=1
    environment:
      - TZ=Asia/Kolkata
    env_file:
      - .env
    depends_on:
      - redis
      - db
    volumes:
      - ./logs:/app/logs # ✅ share same logs folder as web
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.8'   # ← Celery can't starve FastAPI/Postgres during heavy tasks
          memory: 512M

  celery_beat:
    build: .
    container_name: celery-beat
    restart: always
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      - TZ=Asia/Kolkata
    env_file:
      - .env
    depends_on:
      - redis
      - db
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6380:6379"
    deploy:
      resources:
        limits:
          memory: 128M # small task queue for 2 daily tasks — 128M is plenty

  db:
    image: postgres:15
    container_name: postgres-db
    restart: always
    shm_size: 256m
    environment:
      TZ: Asia/Kolkata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: tek_school
    command: >
      postgres
      -c max_connections=20
      -c shared_buffers=128MB
      -c effective_cache_size=512MB
      -c maintenance_work_mem=32MB
      -c work_mem=2MB
      -c wal_buffers=8MB
      -c checkpoint_completion_target=0.9
      -c log_min_duration_statement=500
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c wal_level=replica
      -c max_replication_slots=0
      -c max_logical_replication_workers=0
      -c statement_timeout=30000
      -c lock_timeout=8000
      -c autovacuum_naptime=300
      -c autovacuum_vacuum_cost_delay=20
      -c bgwriter_delay=500
      -c bgwriter_lru_maxpages=10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "tek_school"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
volumes:
  postgres_data:
